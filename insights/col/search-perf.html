<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索与性能工程 | 阿克苏红苹果</title>

<style>
@import url('https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{
  --paper:#f5f4f0; --ink:#1c1a17; --red:#c2372b; --red-deep:#9c2b21;
  --muted:#8a857c; --line:#e6e3dc; --card:#fbfaf7; --body:#33302b;
  --serif:'Noto Serif SC','Songti SC',serif;
  --sans:'Noto Sans SC','PingFang SC',sans-serif;
  --mono:'JetBrains Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--ink); line-height:1.7;
  background:
    radial-gradient(1100px 560px at 88% -8%, rgba(194,55,43,.07), transparent 62%),
    radial-gradient(900px 520px at -8% 108%, rgba(194,55,43,.045), transparent 55%),
    var(--paper);
  min-height:100vh;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(28,26,23,.05) 1px, transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:880px;margin:0 auto;padding:0 28px;position:relative;z-index:1}
a{color:inherit}
/* header */
.site-head{border-bottom:1px solid var(--line);background:rgba(245,244,240,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:50}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:var(--serif);font-weight:900;font-size:1.15rem;text-decoration:none;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
.brand-dot{width:11px;height:11px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:0 0 0 3px rgba(194,55,43,.15)}
.site-head nav{display:flex;gap:22px}
.site-head nav a{font-size:.85rem;color:var(--muted);text-decoration:none;font-weight:500;transition:color .18s}
.site-head nav a:hover{color:var(--red)}
/* footer */
.site-foot{border-top:1px solid var(--line);margin-top:72px;padding:30px 0 40px}
.site-foot p{font-size:.78rem;color:var(--muted);font-family:var(--mono)}
/* badges (review) */
.badge-bar{margin:0 0 26px}
.badge{display:inline-block;color:#fff;padding:2px 10px;border-radius:12px;font-size:.72rem;margin:0 6px 6px 0;font-family:var(--mono)}
/* article body */
article{padding:46px 0 20px}
.kicker{font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;color:var(--red);text-transform:uppercase;margin-bottom:14px;font-weight:600}
article h1{font-family:var(--serif);font-weight:900;font-size:2.15rem;line-height:1.35;margin-bottom:12px;letter-spacing:.01em}
.meta-line{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-bottom:22px}
.meta-line .sep{margin:0 8px;color:var(--line)}
article h2{font-family:var(--serif);font-weight:700;font-size:1.4rem;margin:40px 0 14px}
article h3{font-family:var(--serif);font-weight:700;font-size:1.12rem;margin:28px 0 10px}
article h4{font-size:1rem;font-weight:700;margin:22px 0 8px}
article p{margin-bottom:16px;color:var(--body)}
article blockquote{border-left:3px solid var(--red);margin:18px 0;padding:6px 18px;color:var(--muted);background:rgba(194,55,43,.035)}
article blockquote p{margin-bottom:8px;color:var(--muted)}
article code{background:#eceae4;padding:2px 6px;border-radius:3px;font-size:.86em;font-family:var(--mono)}
article pre{background:#23211e;color:#e8e5df;padding:18px;border-radius:6px;overflow-x:auto;margin:18px 0}
article pre code{background:none;padding:0;color:inherit;font-size:.8rem;line-height:1.6}
article pre code.hljs{background:transparent;padding:0}
article hr{border:none;border-top:1px solid var(--line);margin:34px 0}
article ul,article ol{margin:0 0 16px;padding-left:1.5em}
article li{margin-bottom:7px;color:var(--body)}
article a{color:var(--red-deep);text-decoration:underline;text-decoration-color:rgba(194,55,43,.4);text-underline-offset:3px;transition:text-decoration-color .18s}
article a:hover{text-decoration-color:var(--red)}
.insight-table{width:100%;border-collapse:collapse;margin:18px 0;font-size:.86rem}
.insight-table th{text-align:left;padding:9px 12px;border-bottom:2px solid var(--line);font-weight:700;font-family:var(--serif)}
.insight-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body)}
.back-link{margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
.back-link a{color:var(--muted);text-decoration:none;font-size:.85rem;font-family:var(--mono);transition:color .18s}
.back-link a:hover{color:var(--red)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .55s ease both}
/* ===== 夜间模式（纯叠加，html.dark 覆盖，不改动上方任何浅色规则）===== */
html.dark{
  --paper:#191714; --ink:#e8e5df; --red:#e05545; --red-deep:#e86a5a;
  --muted:#9a958c; --line:#3a3630; --card:#26231c; --body:#c9c5bd;
}
html.dark body{
  background:
    radial-gradient(1100px 560px at 88% -8%, rgba(224,85,69,.06), transparent 62%),
    radial-gradient(900px 520px at -8% 108%, rgba(224,85,69,.04), transparent 55%),
    var(--paper);
}
html.dark body::before{background-image:radial-gradient(rgba(232,229,223,.04) 1px, transparent 1px)}
html.dark .site-head{background:rgba(25,23,20,.85)}
html.dark .brand-dot{box-shadow:0 0 0 3px rgba(224,85,69,.2)}
html.dark article code{background:#26231c}
html.dark article blockquote{background:rgba(224,85,69,.06)}
html.dark article a{text-decoration-color:rgba(224,85,69,.5)}
html.dark .col-intro{color:#b5b0a6}
html.dark .art-guide{color:#9a958c}
#theme-toggle{background:none;border:1px solid var(--line);border-radius:50%;cursor:pointer;
  color:var(--muted);padding:6px;display:flex;align-items:center;justify-content:center;
  transition:color .18s,border-color .18s}
#theme-toggle:hover{color:var(--red);border-color:var(--red)}
#theme-toggle svg{width:15px;height:15px;display:block}
#theme-toggle .icon-sun{display:none}
html.dark #theme-toggle .icon-moon{display:none}
html.dark #theme-toggle .icon-sun{display:block}
/* ===== 滚动缩点 ===== */
body[data-scrolled] .site-head{position:fixed;top:8px;left:8px;width:auto;height:auto;padding:0;border:none;background:transparent;z-index:999;backdrop-filter:none;box-shadow:none;transition:padding .25s,border-radius .25s,background .25s,box-shadow .25s}
body[data-scrolled] .site-head .wrap{display:flex;align-items:center;gap:16px;height:auto;padding:0}
body[data-scrolled] .site-head .brand{visibility:hidden;width:0;overflow:visible;white-space:nowrap;transition:width .25s}
body[data-scrolled] .site-head .brand-dot{visibility:visible;display:inline-block;margin:0;flex-shrink:0}
body[data-scrolled] .site-head nav{visibility:hidden;width:0;overflow:hidden;white-space:nowrap;transition:visibility .2s,width .25s}
body[data-scrolled] .site-head:hover .brand,body[data-scrolled] .site-head:hover nav{visibility:visible;width:auto;overflow:visible}
body[data-scrolled] .site-head:hover{padding:7px 16px;border-radius:8px;background:rgba(245,244,240,.95);backdrop-filter:blur(6px);box-shadow:0 2px 12px rgba(0,0,0,.08)}
html.dark body[data-scrolled] .site-head:hover{background:rgba(25,23,20,.95)}

.col-head{padding:52px 0 8px}
.col-head .kicker{margin-bottom:12px}
.col-head h1{font-family:var(--serif);font-weight:900;font-size:2rem;line-height:1.3;margin-bottom:12px}
.col-sub{font-family:var(--mono);font-size:.8rem;color:var(--red);letter-spacing:.08em;margin:-6px 0 14px}
.col-desc{color:var(--muted);font-size:.95rem;line-height:1.75;max-width:620px;margin-bottom:16px}
.col-intro{font-size:.95rem;color:#555;line-height:1.85;max-width:620px;margin-bottom:18px}
.col-stat{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-bottom:34px}
.art-guide{font-size:.85rem;color:#777;line-height:1.7;margin-top:7px;max-width:640px}
.col-stat b{color:var(--red);font-weight:700}
.art-list{list-style:none}
.art-item{display:flex;gap:20px;align-items:baseline;padding:17px 14px;border-bottom:1px solid var(--line);transition:background .18s,transform .18s;border-radius:4px}
.art-item:hover{background:var(--card);transform:translateX(4px)}
.art-idx{font-family:var(--mono);font-size:.78rem;color:var(--muted);min-width:30px;transition:color .18s}
.art-item:hover .art-idx{color:var(--red)}
.art-main{flex:1}
.art-title{font-size:1rem;font-weight:500;line-height:1.5}
.art-title a{color:var(--ink);text-decoration:none;transition:color .18s}
.art-item:hover .art-title a{color:var(--red-deep)}
.art-date{font-family:var(--mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.art-item .badge-bar{margin:6px 0 0}
.art-sep{list-style:none;height:1px;background:var(--line);margin:8px 14px;padding:0}
</style>
</head><body>
